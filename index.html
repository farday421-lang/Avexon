<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0512" />
    <title>Avexon | Premium Digital Agency & Custom Website Development Solutions</title>
    <meta name="description" content="Avexon is a premium digital agency specializing in custom website development, pre-made website solutions, and interactive portals tailored to grow your business." />
    <meta name="keywords" content="digital agency, website development, custom solution, web portal, business website, premium web design, avexon" />
    
    <!-- Open Graph/Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Avexon | Premium Digital Agency & Custom Website Development Solutions" />
    <meta property="og:description" content="Get premium custom website development and digital solutions designed to elevate your brand. Explore our tailored pre-made websites." />
    <meta property="og:site_name" content="Avexon" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Avexon | Premium Digital Agency & Custom Website Development Solutions" />
    <meta name="twitter:description" content="Discover professional custom website development services with Avexon, your premier partner for custom web solutions." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root">
      <!-- High-Performance Instant Native Preloader -->
      <div id="avexon-preloader" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #010003;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        will-change: opacity;
      ">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 100px; height: 100px; margin-bottom: 24px;">
          <!-- Spinning high-tech halo matching our brand logo style -->
          <div style="
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #a855f7;
            border-right-color: #ec4899;
            animation: avexon-spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
          "></div>
          <!-- Internal ambient glow spot -->
          <div style="
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168,85,247,0.4) 0%, rgba(236,72,153,0.1) 70%);
            animation: avexon-pulse 2s ease-in-out infinite alternate;
          "></div>
          <!-- Stylistic 'A' logo initial matching Avexon branding -->
          <span style="
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #f3e8ff 0%, #fae8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 10;
          ">A</span>
        </div>
        
        <!-- Premium typography loading indicator -->
        <h2 style="
          font-size: 18px;
          font-weight: 700;
          letter-spacing: 0.05em;
          margin: 0;
          background: linear-gradient(to right, #ffffff, #d8b4fe);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-align: center;
        ">AVEXON STUDIO</h2>
        
        <p style="
          font-size: 12px;
          font-weight: 500;
          color: rgba(168, 85, 247, 0.6);
          letter-spacing: 0.15em;
          margin-top: 8px;
          text-transform: uppercase;
        ">Premium Web Agency</p>

        <style>
          @keyframes avexon-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes avexon-pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
